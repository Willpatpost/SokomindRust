[workspace]
members = ["crates/core", "crates/search", "crates/wasm", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
sokomind-core = { path = "crates/core" }
sokomind-search = { path = "crates/search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
lto = true
