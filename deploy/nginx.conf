limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    # Only when another proxy (e.g. TLS on the host) sits in front of this one:
    # every user then shares that proxy's address, and the per-IP request limit
    # collapses into one bucket. Trust the proxy's address to restore per-client
    # limiting. Docker's bridge range covers containers and host connections
    # through the published port; narrow it to the proxy where you can:
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        error_page 429 = @api_limited;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-sent X-Forwarded-For must not reach
        # the API, which trusts this hop (TRUSTED_PROXIES) to name the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        # The API sends its own copies; keep one of each.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }
    # Health checks poll; they must not drain the API rate limit.
    location = /api/health {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }
    # Keep the API's {error} body shape for nginx's own rate-limit rejections.
    location @api_limited {
        # An empty types map keeps a URI extension from overriding the type.
        types { }
        default_type application/json;
        return 429 '{"error":"Too many requests; try again shortly"}';
    }
    location /assets/ {
        try_files $uri =404;
        # add_header in a location drops every server-level header, so the
        # security headers must be repeated wherever caching is declared.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-cache";
    }
}
