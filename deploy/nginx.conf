limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Health polls get their own small budget: they never drain api_limit, yet a
# client cannot flood the API with them either. The API caches its database
# check for a second, so this bounds proxy traffic, not database load.
limit_req_zone $binary_remote_addr zone=health_limit:1m rate=2r/s;
# Vite content-hashes everything under /assets/, so those files are immutable;
# the app shell must be revalidated after every rebuild. API responses are left
# alone: an empty value adds no header.
map $uri $cache_control {
    default    no-cache;
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
}
# Docker can give a recreated api container a new address. "resolve" makes
# nginx look the name up again at run time, through Docker's DNS, about every
# 10 s (valid), instead of using the address found at startup forever; a lookup
# that fails other than with "no such name" is retried after resolver_timeout,
# 5 s instead of 30. It also lets nginx start, and serve the game, while the
# API is down: API requests get 502 until it answers. "resolve" needs nginx
# 1.27.3 or later and the group in shared memory (zone), and takes its
# resolver from this block or from http{}; one in server{} is not used.
# keepalive keeps up to 16 idle connections per worker process for reuse. The
# API sets no idle timeout, so nginx's own 60 s keepalive_timeout closes them,
# and outside an API shutdown a request never races the API closing one.
upstream api {
    zone api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server api:3000 resolve;
    keepalive 16;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Matches BODY_LIMIT in crates/server/src/main.rs, which holds a full
    # MAX_ROUTE solve; change them together. Set below it, nginx refuses
    # legal requests with its own HTML 413 before the API sees them.
    client_max_body_size 128k;
    limit_req_status 429;
    # nginx is the required edge, so the API sends none of these itself. An
    # add_header inside a location would drop all three there.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $cache_control;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    # Only when another proxy (e.g. TLS on the host) sits in front of this one:
    # every user then shares that proxy's address, and the per-IP request limit
    # collapses into one bucket. Trust the proxy's address to restore per-client
    # limiting. Compose's network (pinned in compose.yaml, or TRUSTED_SUBNET if
    # .env sets it) covers containers and host connections through the
    # published port; narrow it to the proxy where you can:
    # set_real_ip_from 172.16.57.0/24;
    # real_ip_header X-Forwarded-For;

    # Shared by both API locations; a proxy_set_header inside a location
    # would drop the four set here. HTTP/1.1 without "Connection: close" lets
    # nginx reuse its connections to the API (upstream api's keepalive).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: a client-sent X-Forwarded-For must not reach
    # the API, which trusts this hop (TRUSTED_PROXIES) to name the client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Part of the solve timeout chain; see TIME_MS in
    # crates/server/src/solve.rs. It outlasts the page's wait for a solve.
    proxy_read_timeout 40s;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        error_page 429 = @api_limited;
        proxy_pass http://api;
    }
    # An exact match wins over /api/, so only health_limit applies here.
    # The health route in crates/server/src/main.rs (checked by scripts/mirrors.test.mjs).
    location = /api/health {
        limit_req zone=health_limit burst=10 nodelay;
        error_page 429 = @api_limited;
        proxy_pass http://api;
    }
    # Keep the API's {error} body shape for nginx's own rate-limit rejections.
    location @api_limited {
        # An empty types map keeps a URI extension from overriding the type.
        types { }
        default_type application/json;
        # The page shows this text as sent for a refused solve, so it names the browser solver.
        return 429 '{"error":"Too many requests; try the browser solver or try again shortly"}';
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
