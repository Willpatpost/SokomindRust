services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokomind
      POSTGRES_DB: sokomind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokomind -d sokomind"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      # Passed to the driver as-is, so any characters are safe. Other
      # settings: README's Configuration table.
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Budgets apply to each API process. Recheck aggregate CPU, memory and
      # PostgreSQL connections before adding replicas.
      SOLVE_CONCURRENCY: ${SOLVE_CONCURRENCY:-1}
      PROGRESS_CONCURRENCY: ${PROGRESS_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      PROGRESS_RETENTION_DAYS: ${PROGRESS_RETENTION_DAYS:-0}
      PROGRESS_RETENTION_BATCH_SIZE: ${PROGRESS_RETENTION_BATCH_SIZE:-500}
      # nginx is the API's only peer and overwrites X-Forwarded-For with its
      # client, so trust Docker's bridge range. If your networks come from
      # another pool (docker network inspect), list that instead.
      TRUSTED_PROXIES: "172.16.0.0/12"
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 35s
  # The required edge: nginx serves the web app and proxies /api to the API,
  # which serves nothing else and is never published.
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  postgres-data:
