services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sokomind
      POSTGRES_DB: sokomind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokomind -d sokomind"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      # The server percent-encodes the password into the connection URL,
      # so any characters are safe here.
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SOLVE_CONCURRENCY: "1"
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 35s
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  postgres-data:
