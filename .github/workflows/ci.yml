name: Validate
# Pushes to main and pull requests (not every branch push, so an open pull
# request is validated once per update, not twice). Docs-only changes skip it;
# workflow_dispatch runs it on demand. The weekly schedule runs only the deploy
# job, whose base images change upstream while this repository does not.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  pull_request:
    paths-ignore: ['**.md', LICENSE]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC

permissions:
  contents: read

# A newer run for the same event and ref (branch or pull request) cancels the
# superseded one. The event keeps the weekly run from cancelling a push's run.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# scripts/validate.mjs runs the rust and integration jobs' `npm run` and
# `node scripts/` steps locally, in this order; scripts/validate.test.mjs fails
# when the two differ.
jobs:
  rust:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        # Exact runner images, as in every job: a -latest label moves to a new
        # image without a commit here. Move them deliberately, with a run first.
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # With no argument, installs the channel, components and target that
      # rust-toolchain.toml names.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # After the toolchain step: the cache key includes the active rustc version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm run fmt:check
      - run: npm run lint:rust
      # -D warnings through a step env:, which both runners' shells honor; an
      # inline VAR=x fails under pwsh and in npm scripts on Windows (cmd.exe).
      # scripts/validate.mjs sets the same variable for this step.
      - run: npm run doc:rust
        env:
          RUSTDOCFLAGS: -D warnings
      - run: npm run test:rust
      - run: npm run test:release

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOKOMIND_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The CLI must equal the wasm-bindgen crate that crates/wasm/Cargo.toml pins
      # with `=` and Cargo.lock records; the two must agree. scripts/build-wasm.mjs
      # (which checks the installed CLI) and the Dockerfile parse the lock the same way.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(grep -m1 -A1 -x 'name = "wasm-bindgen"' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ -z "$version" ]; then
            echo "::error file=Cargo.lock::Cargo.lock does not list wasm-bindgen"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install prebuilt wasm-bindgen
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
          fallback: none
      - run: npm ci
      - run: npm run format:check
      # Cheap checks first. bench:check compares the catalog hash before it builds anything.
      - run: npm run test:web
      - run: npm run test:scripts
      # Kept out of check:web, which needs the WASM bindings in web/wasm and so
      # runs later, inside build:web; the scripts type-check without them.
      - run: npm run check:scripts
      - run: npm run bench:check
      # The only WASM build. `npm run build` and `npm run test:parity` would each
      # rebuild it, so their second halves run directly.
      - run: npm run wasm
      - run: npm run build:web
      # Reuses the native records bench:check just wrote instead of rerunning the corpus.
      - run: node scripts/parity.mjs --native target/bench/catalog.json
      - run: npm run bench:observe
      - run: npm run test:db
      # Browsers are cached per runner image and Playwright version: Playwright
      # downloads a build per OS release, and the runner's ImageOS (ubuntu24, for
      # example) names it. The system packages they need are not cached, so a
      # cache hit still installs those.
      - name: Read the Playwright version and runner image
        id: playwright
        run: |
          version=$(npx playwright --version | sed -n 's/^Version //p')
          if [ -z "$version" ]; then
            echo "::error::npx playwright --version printed no version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # GitHub sets CI=true in every job already; naming it here lets
      # scripts/validate.mjs set the same variable for this step.
      - run: npm run test:browser
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-results
          path: |
            target/bench/catalog.json
            target/bench/report.txt
            target/bench/observe.json
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Runs the deploy job when a push or pull request changes a file that shapes
  # the images or their config, and on every weekly or manual run. A change to
  # sources alone waits for the weekly run.
  deploy-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diff the deploy inputs against the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths=(Dockerfile .dockerignore compose.yaml .env.example deploy .github/workflows/ci.yml
            rust-toolchain.toml Cargo.toml Cargo.lock 'crates/*/Cargo.toml'
            .node-version package.json package-lock.json
            web/tsconfig.json web/vite.config.ts)
          # Only a clean diff skips the deploy job. Without a usable base it runs:
          # no base at all (a weekly or manual run), the all-zero before of the
          # push that creates the branch, and a before that can no longer be
          # fetched (a force push whose old head is gone). A failing diff also runs it.
          deploy=true
          if [[ "$BASE" =~ ^0*$ ]]; then
            echo "No base to diff against ('$BASE'); counting the deploy inputs as changed."
          elif ! git fetch --quiet --depth=1 origin "$BASE"; then
            echo "::notice::The base $BASE cannot be fetched; counting the deploy inputs as changed."
          elif git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
            deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # compose.yaml parses, nginx accepts deploy/nginx.conf, both images build, and
  # the stack they make starts and answers through nginx (the smoke test at the
  # end). Nothing is pushed.
  deploy:
    needs: deploy-changes
    if: needs.deploy-changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Dockerfile cannot read .node-version, so its NODE_VERSION default is a copy.
      - name: Check the Dockerfile's NODE_VERSION against .node-version
        run: |
          expected=$(tr -d '\r\n' < .node-version)
          actual=$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)
          if [ "$actual" != "$expected" ]; then
            echo "::error file=Dockerfile::ARG NODE_VERSION is '$actual', but .node-version says '$expected'"
            exit 1
          fi
      # Likewise the rust base image and Cargo.toml's rust-version copy the channel
      # rust-toolchain.toml pins. deploy-changes lists all three files, so an edit
      # to any of them runs this check.
      - name: Check the Rust version copies against rust-toolchain.toml
        run: |
          expected=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          image=$(sed -n 's/^FROM rust:\([^ -]*\)-.* AS rust-base.*/\1/p' Dockerfile)
          msrv=$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' Cargo.toml)
          if [ -z "$expected" ]; then
            echo "::error file=rust-toolchain.toml::No channel line was found"
            exit 1
          fi
          status=0
          if [ "$image" != "$expected" ]; then
            echo "::error file=Dockerfile::The rust-base image tag is '$image', but rust-toolchain.toml pins '$expected'"
            status=1
          fi
          if [ "$msrv" != "$expected" ]; then
            echo "::error file=Cargo.toml::rust-version is '$msrv', but rust-toolchain.toml pins '$expected'"
            status=1
          fi
          exit $status
      # compose.yaml refuses to load without POSTGRES_PASSWORD; any value will do.
      - name: Check compose.yaml
        env:
          POSTGRES_PASSWORD: ci
        run: docker compose config --quiet
      # The nginx image and conf path come from the Dockerfile's web stage, so this
      # tests what that image runs. --add-host stands in for compose's network,
      # where the upstream's api name resolves.
      - name: Check deploy/nginx.conf
        run: |
          image=$(sed -n 's/^FROM \(nginx:[^ ]*\) AS web$/\1/p' Dockerfile)
          conf=$(sed -n 's|^COPY deploy/nginx.conf \(/[^ ]*\)$|\1|p' Dockerfile)
          if [ -z "$image" ] || [ -z "$conf" ]; then
            echo "::error file=Dockerfile::The web stage's nginx image or conf path was not found"
            exit 1
          fi
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:$conf:ro" "$image" nginx -t
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # compose.yaml's two build targets. Each keeps its own cache scope, because a
      # shared one would let the second build's export replace the first's; mode=max
      # also caches the intermediate stages, where the dependency builds are. load
      # puts each image in the runner's Docker, under the tag the smoke test's
      # compose.override.yaml gives its service.
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          load: true
          tags: sokomind-smoke-api
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: sokomind-smoke-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # The runtime smoke test, about two minutes. The stack starts as README's
      # "Full stack with Docker" starts it, with .env copied from .env.example
      # (so deploy-changes lists that file), except that compose.override.yaml,
      # which compose merges over compose.yaml by default, runs the images built
      # above instead of building them again. --wait returns once db is healthy
      # and api and web are running. Every check goes through nginx's published
      # port, so between them they cover:
      # - /api/health reporting persistence: nginx's upstream finds the api
      #   container, and the API reached PostgreSQL with compose's credentials
      #   and ran its migrations.
      # - One small /api/solve: the native search, within the server's limits.
      # - A progress save, then a read of it: a write and a read through the
      #   migrated schema.
      # - The app shell at /, and the WASM served as application/wasm, the type
      #   the browser's streaming compile needs.
      - name: Start the compose stack
        id: compose-up
        timeout-minutes: 5
        run: |
          cp .env.example .env
          cat > compose.override.yaml <<'EOF'
          services:
            api:
              image: sokomind-smoke-api
              pull_policy: never
            web:
              image: sokomind-smoke-web
              pull_policy: never
          EOF
          docker compose up --detach --wait --wait-timeout 120 --no-build
      - name: Smoke-test the stack through nginx
        timeout-minutes: 3
        run: |
          base=http://127.0.0.1:8080
          reply="$RUNNER_TEMP/reply"
          # Fails unless the curl request in the arguments after the first two
          # answers status $1 with a body for which jq filter $2 prints true.
          # Comparing jq's output, not its exit status, also fails an empty body.
          expect() {
            local status=$1 filter=$2 got
            shift 2
            got=$(curl -sS --max-time 15 -o "$reply" -w '%{http_code}' "$@")
            echo "$got $(cat "$reply")"
            if [ "$got" != "$status" ] || [ "$(jq "$filter" "$reply")" != true ]; then
              echo "::error::Expected $status and $filter from curl $*"
              exit 1
            fi
          }
          # The API answers only once it has migrated the database, so poll
          # (nginx's health_limit allows 2 requests a second).
          deadline=$((SECONDS + 90))
          until [ "$(curl -fs --max-time 5 "$base/api/health" | jq .persistence)" = true ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::/api/health did not report persistence through nginx within 90 s"
              exit 1
            fi
            sleep 1
          done
          expect 200 '.status == "ok" and .persistence == true' "$base/api/health"
          # The catalog's ultra-tiny board, solved by one push down: solve_body in
          # crates/server/src/tests/mod.rs, which the router tests send.
          expect 200 '.status == "solved" and .route == "D" and .proof.kind == "optimal"' \
            -H 'Content-Type: application/json' \
            -d '{"rows":["OOOOO","O R O","O A O","O a O","OOOOO"],"mode":"optimal","time_ms":1000,"max_states":1000,"memory_mib":4}' \
            "$base/api/solve"
          profile=0123456789abcdef0123456789abcdef
          expect 200 '.saved == true and .improved == true' \
            -H 'Content-Type: application/json' -H "x-profile-id: $profile" \
            -d '{"route":"D"}' "$base/api/progress/ultra-tiny"
          expect 200 '.route == "D" and .moves == 1' -H "x-profile-id: $profile" "$base/api/progress/ultra-tiny"
          curl -fsS --max-time 15 -o "$RUNNER_TEMP/index.html" "$base/"
          if ! grep -q '<title>Sokomind' "$RUNNER_TEMP/index.html"; then
            echo "::error::nginx did not serve the app shell at /"
            exit 1
          fi
          wasm=$(docker compose exec -T web ls /usr/share/nginx/html/assets | grep '\.wasm$' | sed -n 1p)
          if [ -z "$wasm" ]; then
            echo "::error::The web image has no .wasm file in /usr/share/nginx/html/assets"
            exit 1
          fi
          type=$(curl -fsS --max-time 15 -o /dev/null -w '%{content_type}' "$base/assets/$wasm")
          if [ "$type" != application/wasm ]; then
            echo "::error::nginx served /assets/$wasm as '$type', not application/wasm"
            exit 1
          fi
      - name: Print the compose stack's state and logs
        if: failure() && steps.compose-up.outcome != 'skipped'
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
      # Also after a failed check or a cancellation, once the stack was started.
      - name: Stop the compose stack and delete its volume
        if: always() && steps.compose-up.outcome != 'skipped'
        timeout-minutes: 2
        run: docker compose down --volumes
