name: Validate
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # After the toolchain step: the cache key includes the active rustc version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm run fmt:check
      - run: npm run lint:rust
      - run: npm run test:rust
      - run: npm run test:release

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOKOMIND_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Cargo.lock is the only wasm-bindgen version pin; build-wasm.mjs checks the CLI against it.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(grep -m1 -A1 -x 'name = "wasm-bindgen"' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ -z "$version" ]; then
            echo "::error file=Cargo.lock::Cargo.lock does not list wasm-bindgen"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install prebuilt wasm-bindgen
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
          fallback: none
      - run: npm ci
      # Cheap checks first. bench:check compares the catalog hash before it builds anything.
      - run: npm run test:web
      - run: npm run test:scripts
      - run: npm run bench:check
      # The only WASM build. `npm run build` and `npm run test:parity` would each
      # rebuild it, so their second halves run directly.
      - run: npm run wasm
      - run: npm run build:web
      # Reuses the native records bench:check just wrote instead of rerunning the corpus.
      - run: node scripts/parity.mjs --native target/bench/catalog.json
      - run: npm run bench:observe
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-results
          path: |
            target/bench/catalog.json
            target/bench/report.txt
            target/bench/observe.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
